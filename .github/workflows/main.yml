name: Build and release

on:
  push:
    branches: [master, main]
    paths:
      - '**'
      - '!.github/**'
      - '!.gitignore'
      - '!*.md'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build tac-plus-ng binaries and deb
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - run: scripts/build.sh
      - run: scripts/deb-pkg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            *.tar.gz
            *.deb
          if-no-files-found: error

  create-release:
    name: Get artifacts and create release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: build-artifacts
      - run: |
          gh release create tac-plus-ng-$(date +%Y%m%d%M) $(find -type f -printf '%p ') --notes-file - <<'#####'
          tacacs-plus-ng

          #####
        working-directory: ./build-artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-images:
    name: Build Docker images and push to repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: build-artifacts
      - run:  cp -rf ./build-artifacts dist
      - run: ./docker-build.sh
        working-directory: ./docker
      - run: |
          . ../scripts/version.sh
          docker tag tacacs-plus-ng:latest ghcr.io/${{ github.repository_owner }}/tacacs-plus-ng:${{ env.VERSION }} 
          docker tag tacacs-plus-ng:latest ghcr.io/${{ github.repository_owner }}/tacacs-plus-ng:latest
          docker push ghcr.io/${{ github.repository_owner }}/tacacs-plug-ng/${{ env.VERSION }} 
          docker push ghcr.io/${{ github.repository_owner }}/tacacs-plug-ng:latest
