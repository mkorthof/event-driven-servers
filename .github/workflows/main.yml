name: Build and release

on:
  push:
    branches: [master, main, dist]
    paths:
      - '**'
      - '!.github/**'
      - '!.gitignore'
      - '!*.md'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build binaries and debian package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - run: |
          sudo apt-get update
          sudo apt-get --no-install-recommends -yq install \
            build-essential \
            devscripts \
            debhelper \
            dpkg-dev \
            dh-make \
            ca-certificates \
            $(cat docker/apt-prerequisites)
      - run: ./build.sh
        working-directory: ./scripts
      - uses: actions/upload-artifact@v6
        with:
          name: build-artifacts-bin
          path: |
            **/*.tar.gz
          if-no-files-found: error
      - run: scripts/deb-pkg.sh
      - uses: actions/upload-artifact@v6
        with:
          name: build-artifacts-deb
          path: |
            *.deb
          if-no-files-found: error

  create-release:
    name: Get artifacts and create new release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: build-artifacts-bin
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: build-artifacts-deb
          path: dist
      - run: |
          gh release create tac-plus-ng-${GITHUB_SHA::7} $(find ./dist -type f -printf '%p ') --notes-file - <<'#####'
          tac_plus-ng binaries and debian package
          #####
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  docker-images:
    name: Build Docker images and push to repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs: build
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v8
        with:
          name: build-artifacts-deb
          path: ./docker/dist
      - run: |
          ./docker-build.sh
          docker tag tacacs-plus-ng:latest ghcr.io/${{ github.repository_owner }}/tacacs-plus-ng:${GITHUB_SHA::7}
          docker tag tacacs-plus-ng:latest ghcr.io/${{ github.repository_owner }}/tacacs-plus-ng:latest
          docker push ghcr.io/${{ github.repository_owner }}/tacacs-plug-ng/:${GITHUB_SHA::7}
          docker push ghcr.io/${{ github.repository_owner }}/tacacs-plug-ng:latest
        working-directory: ./docker