name: Build and release

on:
  push:
    branches: [master, main, dist]
    paths:
      - '**'
      - '!.github/**'
      - '!.gitignore'
      - '!*.md'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build binaries and debian package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - run: |
          sudo apt-get update
          sudo apt-get --no-install-recommends -yq install \
            build-essential \
            devscripts \
            debhelper \
            dpkg-dev \
            dh-make \
            ca-certificates \
            git curl clang make libc6-dev libssl-dev libcrypt-dev libcrypto++-dev libpam0g-dev libpcre2-dev libc-ares-dev libcurl4-openssl-dev zlib1g-dev libldap-dev libradcli-dev libfreeradius-dev libsctp-dev python3 \
            perl libauthen-simple-radius-perl libcrypt-generatepassword-perl libgetopt-long-descriptive-perl libnet-frame-simple-perl libnet-frame-layer-ipv6-perl libnet-ip-perl libnet-rawip-perl libnet-write-perl
      - run: scripts/build.sh
      - run: scripts/deb-pkg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            *.tar.gz
            *.deb
          if-no-files-found: error

  create-release:
    name: Get artifacts and create new release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: dist
      #gh release create tac-plus-ng-${{ env.VERSION }} $(find ./dist -type f -printf '%p ') --notes-file - <<'#####'
       #   . ./scripts/version.sh
      - run: |
          gh release create --tag "$( echo "$GITHUB_SHA" | cut -c1-7)" $(find ./dist -type f -printf '%p ') --notes-file - <<'#####'
          tac_plus-ng binaries and debian package

          #####
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-images:
    name: Build Docker images and push to repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs: build
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: dist
      - run: ./docker-build.sh
        working-directory: ./docker
      - run: |
          . ../scripts/version.sh
          docker tag tacacs-plus-ng:latest --tag ghcr.io/${{ github.repository }}:${{ env.VERSION }} --tag ghcr.io/${{ github.repository }}:latest
          docker push ghcr.io/${{ github.repository }}:${{ env.VERSION }} 
          docker push ghcr.io/${{ github.repository }}:latest
